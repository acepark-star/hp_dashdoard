<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #FF540F;
    --primary-strong: #f3511d;
    --primary-bg: #fff3ee;
    --bg: #f7f9fa;
    --surface: #ffffff;
    --tray: rgba(105,118,131,.065);
    --fill: rgba(105,118,131,.07);
    --line: rgba(105,118,131,.20);
    --line-weak: rgba(105,118,131,.11);
    --text-primary: #0d0d0d;
    --text-secondary: rgba(13,13,13,.61);
    --text-muted: rgba(13,13,13,.40);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 14px;
    /* 사내 어드민과 같은 헤더 (색·높이 동일) */
    --topbar-bg: #041527;
    --topbar-h: 63px;
    --shadow-card: 0 1px 2px -1px rgba(23,23,23,.10);
    --shadow-hover: 0 3px 12px -3px rgba(23,23,23,.18);
  }

  /* 스크롤 끝에서 화면이 튕기면(러버밴드) 고정된 상단바·편집 띠가 같이 밀려 보인다.
     바깥으로 넘기는 스크롤 자체를 막아 끝에서도 제자리에 있게 한다. */
  html, body { overscroll-behavior: none; }

  body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }

  /* ── Overlay Screens ── */
  #loadingScreen, #loginScreen, #blockedScreen {
    display: none; position: fixed; inset: 0; background: var(--bg);
    z-index: 300; align-items: center; justify-content: center; flex-direction: column;
  }
  #loadingScreen.visible, #loginScreen.visible, #blockedScreen.visible { display: flex; }
  .spinner {
    width: 34px; height: 34px; border: 3px solid rgba(105,118,131,.20);
    border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .login-card {
    background: var(--surface); border-radius: 20px; padding: 36px 32px;
    text-align: center; box-shadow: 0 4px 24px -8px rgba(23,23,23,.14); max-width: 340px; width: calc(100% - 40px);
  }
  .login-logo { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
  .login-logo img { width: 48px; height: 48px; object-fit: contain; }
  .login-title { font-size: 16px; font-weight: 700; margin-bottom: 22px; letter-spacing: -.02em; }
  .btn-google {
    width: 100%; height: 46px; border-radius: var(--radius-sm); border: 1px solid var(--line);
    background: #fff; font: inherit; font-size: 14px; font-weight: 600; color: var(--text-primary);
    display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer;
  }
  .btn-google:hover { background: var(--fill); }
  .btn-google svg { width: 18px; height: 18px; }
  .login-notice { margin-top: 14px; font-size: 12px; color: var(--text-muted); }
  .login-error { margin-top: 12px; font-size: 12.5px; color: #cf4040; white-space: pre-line; display: none; }
  .login-error.visible { display: block; }

  .blocked-card {
    background: var(--surface); border-radius: 20px; padding: 36px 32px; text-align: center;
    box-shadow: 0 4px 24px -8px rgba(23,23,23,.14); max-width: 340px; width: calc(100% - 40px);
  }
  .blocked-icon { font-size: 30px; margin-bottom: 12px; }
  .blocked-title { font-size: 16px; font-weight: 700; }
  .blocked-desc { margin-top: 8px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .blocked-email { margin-top: 12px; font-size: 12.5px; color: var(--text-muted); word-break: break-all; }
  .btn-logout {
    margin-top: 20px; width: 100%; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--line);
    background: #fff; font: inherit; font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer;
  }
  .btn-logout:hover { background: var(--fill); color: var(--text-primary); }

  /* ── App ── */
  #app { display: none; }
  #app.visible { display: block; }

  /* ── Top bar ── */
  .topbar {
    background: var(--topbar-bg); padding: 0 24px; display: flex; align-items: center;
    gap: 14px; height: var(--topbar-h); position: sticky; top: 0; z-index: 40;
  }
  /* 화살표 아이콘 + '강남언니 영업팀' 텍스트.
     원본 로고의 비율을 그대로 옮겼다 — 화살표 높이 = 한글 잉크 높이 × 1.089,
     아이콘과 글자 사이 = 한글 잉크 높이 × 0.294.
     20px Noto Sans KR 의 한글 잉크 높이는 약 19px 이고, 아이콘 이미지는
     128px 캔버스에 잉크가 118px(0.92)이라 캔버스 높이를 22px 로 잡으면 잉크가 20.3px 이 된다. */
  .brand { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .brand img { height: 22px; width: auto; object-fit: contain; display: block; }
  .brand b { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -.02em;
    white-space: nowrap; line-height: 1; }
  .tb-spacer { flex: 1 1 auto; }
  .tb-search { position: relative; flex: 0 1 260px; min-width: 110px; }
  .tb-search input {
    width: 100%; height: 34px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,.20);
    background: rgba(255,255,255,.08); padding: 0 11px 0 32px; font: inherit; font-size: 13px; color: #fff;
  }
  .tb-search input::placeholder { color: rgba(255,255,255,.45); }
  .tb-search input:focus { outline: none; border-color: rgba(255,255,255,.55); background: rgba(255,255,255,.14); }
  .tb-search .si { position: absolute; left: 10px; top: 9px; width: 15px; height: 15px;
    stroke: rgba(255,255,255,.5); fill: none; stroke-width: 1.8; }
  .tb-btn {
    height: 32px; border-radius: var(--radius-sm); border: 0; background: var(--primary); color: #fff;
    font: inherit; font-size: 12.5px; font-weight: 600; padding: 0 13px; cursor: pointer; white-space: nowrap; flex: 0 0 auto;
  }
  .tb-btn:hover { background: var(--primary-strong); }
  .tb-ghost { background: transparent; color: rgba(255,255,255,.88); border: 1px solid rgba(255,255,255,.28); }
  .tb-ghost:hover { background: rgba(255,255,255,.12); color: #fff; }
  .tb-ghost.active { background: rgba(255,106,59,.22); color: #ffb499; border-color: rgba(255,106,59,.6); }
  .lbl-sm { display: none; }

  /* ── 순서 편집 ──
     편집 중에도 평소 보던 뷰(보드/리스트) 그대로 보여준다. 저장했을 때
     실제로 어떤 모습이 되는지 그 자리에서 확인할 수 있어야 하기 때문. */
  .ro-sticky { position: sticky; top: var(--topbar-h); z-index: 30; background: var(--bg);
    padding: 12px 0 10px; margin: -12px 0 4px; }
  .ro-bar { display: flex; align-items: center; gap: 10px; background: var(--primary-bg);
    color: var(--primary-strong); border-radius: var(--radius-md); padding: 11px 14px;
    font-size: 12.5px; font-weight: 600; }
  .ro-bar .sp { flex: 1 1 auto; }
  .ro-bar .hint { font-weight: 500; color: var(--text-secondary); min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ro-save, .ro-cancel { height: 32px; border-radius: var(--radius-sm); font: inherit; font-size: 12.5px;
    font-weight: 600; padding: 0 14px; cursor: pointer; border: 0; flex: 0 0 auto; }
  .ro-save { background: var(--primary); color: #fff; }
  .ro-save:hover { background: var(--primary-strong); }
  .ro-save:disabled { background: rgba(105,118,131,.25); cursor: not-allowed; }
  .ro-cancel { background: transparent; border: 1px solid var(--line); color: var(--text-secondary); }
  .ro-cancel:hover { background: var(--fill); }

  body.reorder-mode .colh, body.reorder-mode .lgrp { cursor: grab; }
  body.reorder-mode .card, body.reorder-mode .lrow { cursor: grab; }
  body.reorder-mode .card:hover { transform: none; }
  body.reorder-mode .lrow:hover { background: transparent; }
  .dragging { opacity: .35; }
  .col.dragging, .lgrpbox.dragging { opacity: .45; }
  .rogrip { width: 13px; height: 13px; flex: 0 0 auto; stroke: var(--text-muted); fill: none;
    stroke-width: 1.8; stroke-linecap: round; }
  .card .rogrip { position: absolute; top: 12px; right: 11px; z-index: 2; }
  .lrow .rogrip { justify-self: start; }
  .colh .rogrip, .lgrp .rogrip { margin-right: -2px; }
  .card.roitem:focus-visible, .lrow.roitem:focus-visible,
  .col:focus-visible, .lgrpbox:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .lgrpbody { display: block; }
  .tb-user { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff;
    display: grid; place-items: center; font-size: 11px; font-weight: 700; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .tb-user .nm { font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.92); }
  .icon-btn { width: 30px; height: 30px; border-radius: var(--radius-sm); border: 0; background: transparent; cursor: pointer;
    display: grid; place-items: center; flex: 0 0 auto; }
  .icon-btn svg { width: 16px; height: 16px; stroke: var(--text-muted); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn:hover { background: var(--fill); }
  .icon-btn:hover svg { stroke: var(--text-primary); }
  .topbar .icon-btn svg { stroke: rgba(255,255,255,.6); }
  .topbar .icon-btn:hover { background: rgba(255,255,255,.12); }
  .topbar .icon-btn:hover svg { stroke: #fff; }

  /* 뷰 전환 */
  .seg { display: inline-flex; background: rgba(255,255,255,.10); border-radius: 9px; padding: 3px; gap: 2px;
    flex: 0 0 auto; border: 1px solid rgba(255,255,255,.14); }
  .seg button { border: 0; background: transparent; font: inherit; font-size: 12.5px; font-weight: 600;
    color: rgba(255,255,255,.62); padding: 5px 11px; border-radius: 7px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .seg button:hover { color: #fff; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--topbar-bg); }
  .seg svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }

  /* ── Page ── */
  .page { padding: 20px 24px 32px; }
  .notice { display: none; align-items: center; gap: 10px; background: #fbf9f1; border-radius: var(--radius-md);
    padding: 10px 14px; font-size: 12.5px; color: #7a6a1f; margin-bottom: 14px; }
  .notice.visible { display: flex; }
  .notice button { margin-left: auto; border: 0; background: transparent; cursor: pointer; color: #7a6a1f;
    font: inherit; font-size: 12px; font-weight: 600; text-decoration: underline; }

  .sec-h { display: flex; align-items: center; gap: 8px; margin: 0 0 11px; font-size: 12.5px; font-weight: 700; }
  .sec-h .n { color: var(--text-muted); font-weight: 500; font-size: 11px; font-variant-numeric: tabular-nums; }
  .sec-h .rule { flex: 1 1 auto; height: 1px; background: var(--line-weak); }
  .sec-h .star-ico { width: 14px; height: 14px; fill: var(--primary); }

  /* 즐겨찾기 레일 */

  /* 최근 본 */
  .recent { display: flex; gap: 7px; flex-wrap: wrap; }
  .rchip { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px 0 11px;

  .rchip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rchip .ago { font-size: 10.5px; color: var(--text-muted); flex: 0 0 auto; }
  .recent-empty { font-size: 12.5px; color: var(--text-muted); }

  /* ── 보드형 ── */
  /* 칸 최소 폭 300px, 최대 6열 — 창 폭에 따라 열 수가 자동으로 늘고 준다 */
  .board { columns: 300px 5; column-gap: 14px; }
  .col { break-inside: avoid; display: block; margin: 0 0 14px; min-width: 0;
    background: var(--tray); border-radius: var(--radius-lg); padding: 12px 12px 13px; }
  .colh { display: flex; align-items: center; gap: 8px; padding: 0 1px 11px; }
  .chip { display: inline-flex; align-items: center; height: 25px; padding: 0 11px; border-radius: 999px;
    font-size: 12px; font-weight: 700; white-space: nowrap; }
  .colh .n { margin-left: auto; font-weight: 500; color: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .colbody { display: flex; flex-direction: column; gap: 9px; }

  /* ── 카드 ── */
  .card { position: relative; background: var(--surface); border-radius: var(--radius-md);
    padding: 13px 56px 12px 14px; box-shadow: var(--shadow-card);
    transition: box-shadow .15s ease, transform .15s ease; }
  .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .card-link { position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
  .card-link:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .card .ct { font-size: 15px; font-weight: 600; line-height: 1.5; letter-spacing: -0.3px; word-break: keep-all; }
  /* 설명은 항상 한 줄. 버튼은 카드 상단에만 있으므로 오른쪽 여백을 되돌려 폭을 넓게 쓴다 */
  .card .cd { margin-top: 6px; margin-right: -42px; font-size: 12.5px; font-weight: 400; line-height: 1.55;
    letter-spacing: -0.2px; color: var(--text-secondary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.selectable .cd { margin-right: 0; }
  .card .cm { margin-top: 8px; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .card.isfav { box-shadow: 0 1px 2px -1px rgba(243,81,29,.22), inset 0 0 0 1px rgba(255,106,59,.32); }
  .card.isfav:hover { box-shadow: var(--shadow-hover), inset 0 0 0 1px rgba(255,106,59,.46); }

  .fav, .edit { position: absolute; top: 8px; width: 24px; height: 24px; border: 0; background: transparent;
    padding: 0; cursor: pointer; display: grid; place-items: center; border-radius: 6px; z-index: 2; }
  .fav { right: 8px; }
  .edit { right: 31px; opacity: 0; }
  .card:hover .edit, .edit:focus-visible { opacity: 1; }
  .fav svg, .edit svg { width: 13px; height: 13px; stroke: rgba(13,13,13,.24); fill: none; stroke-width: 1.7;
    stroke-linejoin: round; stroke-linecap: round; }
  .fav:hover svg, .edit:hover svg { stroke: var(--primary); }
  .fav.on svg { fill: var(--primary); stroke: var(--primary); }
  .fav:focus-visible, .edit:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

  /* ── 리스트형 ── */
  .list { background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-card); }
  .lhead { display: grid; grid-template-columns: 30px 1fr 90px 92px 54px; gap: 10px; padding: 9px 16px;
    font-size: 10.5px; font-weight: 600; color: var(--text-muted); background: var(--bg); letter-spacing: .03em; }
  .lhead .d { text-align: right; }
  .lgrp { display: flex; align-items: center; gap: 9px; padding: 12px 16px 8px; }
  .lgrp .n { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .lrow { position: relative; display: grid; grid-template-columns: 30px 1fr 90px 92px 54px; gap: 10px;
    align-items: center; padding: 8px 16px; border-top: 1px solid var(--line-weak); }
  .lrow:hover { background: var(--fill); }
  .lrow .card-link { border-radius: 0; }
  .lrow .fav { position: static; justify-self: start; }
  .lrow .t { min-width: 0; font-size: 15px; font-weight: 500; letter-spacing: -0.3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .a { font-size: 11px; color: var(--text-secondary); }
  .lrow .d { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; text-align: right; }
  .lrow .acts { display: flex; align-items: center; gap: 2px; justify-self: end; z-index: 2; }
  .lrow .edit { position: static; opacity: 0; }
  .lrow:hover .edit, .lrow .edit:focus-visible { opacity: 1; }
  .lrow .go { width: 13px; height: 13px; stroke: var(--text-muted); fill: none; stroke-width: 1.7; }
  .lrow:hover .go { stroke: var(--primary); }
  @media (max-width: 760px) {
    .lrow, .lhead { grid-template-columns: 30px 1fr 76px 30px; }
    .lrow .a, .lhead .a { display: none; }
    .lrow .go { display: none; }
  }

  .empty { padding: 48px 16px; text-align: center; font-size: 13px; color: var(--text-muted); line-height: 1.7; }

  /* ── 보관함 ── */
  .archbar { margin-top: 18px; background: var(--fill); border-radius: var(--radius-md); padding: 11px 15px;
    display: flex; align-items: center; gap: 10px; font: inherit; font-size: 12.5px; color: var(--text-secondary);
    cursor: pointer; width: 100%; border: 0; text-align: left; }
  .archbar:hover { background: rgba(105,118,131,.12); }
  .archbar:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .archbar b { font-weight: 600; color: var(--text-primary); }
  .archbar .n { margin-left: auto; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .archbar[aria-expanded="true"] { background: rgba(105,118,131,.12); border-radius: var(--radius-md) var(--radius-md) 0 0; }
  /* 접힌 상태 '>' → 펼치면 'v' (아이콘은 오른쪽 꺾쇠, 열릴 때 90도 회전) */
  .chev { width: 14px; height: 14px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round;
    stroke-linejoin: round; transition: transform .18s ease; flex: 0 0 auto; }
  .archbar[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .archpanel { background: rgba(105,118,131,.045); border-radius: 0 0 var(--radius-md) var(--radius-md); padding: 13px 15px 15px; }
  .archnote { font-size: 11.5px; color: var(--text-muted); margin-bottom: 10px; }
  .archgrid { columns: 280px 5; column-gap: 11px; }
  .acard { position: relative; break-inside: avoid; margin-bottom: 9px; background: rgba(105,118,131,.06);
    border-radius: 11px; padding: 10px 44px 10px 13px; }
  .acard:hover { background: rgba(105,118,131,.12); }
  .acard .ct { font-size: 13.5px; font-weight: 500; line-height: 1.5; letter-spacing: -0.2px; color: var(--text-secondary); }
  .acard .cm { margin-top: 6px; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .acard .edit { opacity: 0; right: 9px; }
  .acard:hover .edit, .acard .edit:focus-visible { opacity: 1; }

  /* ── 삭제 모드 ── */
  body.delete-mode .card-link { pointer-events: none; }
  body.delete-mode .fav, body.delete-mode .edit { display: none; }
  .card.selectable, .lrow.selectable, .acard.selectable { cursor: pointer; }
  .card.selectable { padding-left: 40px; }
  .acard.selectable { padding-left: 40px; }
  .card-checkbox { position: absolute; left: 13px; top: 13px; width: 17px; height: 17px; border-radius: 5px;
    border: 1.5px solid var(--line); background: #fff; display: grid; place-items: center;
    font-size: 11px; color: #fff; font-weight: 700; z-index: 2; }
  .lrow .card-checkbox { position: static; justify-self: start; }
  .selected .card-checkbox { background: var(--primary); border-color: var(--primary); }
  .card.selected, .acard.selected { box-shadow: 0 1px 2px -1px rgba(243,81,29,.3), inset 0 0 0 2px var(--primary); }
  .lrow.selected { background: var(--primary-bg); }
  .delete-banner { display: none; background: var(--primary-bg); color: var(--primary-strong); border-radius: var(--radius-md);
    padding: 10px 14px; font-size: 12.5px; font-weight: 600; margin-bottom: 14px; }
  .delete-banner.open { display: block; }
  .delete-bar { position: fixed; left: 0; right: 0; bottom: -80px; background: var(--surface);
    border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 9px; justify-content: flex-end;
    transition: bottom .2s ease; z-index: 60; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .delete-bar.open { bottom: 0; }
  .db-cancel, .db-delete { height: 36px; border-radius: var(--radius-sm); font: inherit; font-size: 13px;
    font-weight: 600; padding: 0 16px; cursor: pointer; border: 0; }
  .db-cancel { background: transparent; border: 1px solid var(--line); color: var(--text-secondary); }
  .db-cancel:hover { background: var(--fill); }
  .db-delete { background: #eb4949; color: #fff; }
  .db-delete:hover { background: #cf4040; }
  .db-delete:disabled { background: rgba(105,118,131,.25); cursor: not-allowed; }

  /* ── Modal ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(13,13,13,.4);
    z-index: 200; align-items: center; justify-content: center; opacity: 0; transition: opacity .2s ease; padding: 20px; }
  .modal-overlay.open { opacity: 1; }
  .modal-dialog { background: var(--surface); border-radius: 18px; padding: 24px; width: 100%; max-width: 400px;
    transform: translateY(8px); transition: transform .2s ease; max-height: 90vh; overflow-y: auto; }
  .modal-overlay.open .modal-dialog { transform: translateY(0); }
  .modal-header { display: flex; align-items: center; margin-bottom: 18px; }
  .modal-title { font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
  .modal-close { margin-left: auto; width: 28px; height: 28px; border: 0; background: transparent; cursor: pointer;
    display: grid; place-items: center; border-radius: 6px; }
  .modal-close:hover { background: var(--fill); }
  .modal-close svg { width: 15px; height: 15px; stroke: var(--text-muted); fill: none; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  .field label .opt { font-weight: 500; color: var(--text-muted); }
  .field-hint { margin-top: 5px; font-size: 11px; color: var(--text-muted); text-align: right;
    font-variant-numeric: tabular-nums; }
  .field-hint.full { color: #cf4040; font-weight: 600; }
  .field-label-row { display: flex; align-items: baseline; gap: 8px; }
  .field-label-row label { margin-bottom: 6px; }
  .field-error { font-size: 11.5px; color: #cf4040; margin-left: auto; }
  .field input, .field select { width: 100%; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--line);
    background: #fff; padding: 0 12px; font: inherit; font-size: 13.5px; color: var(--text-primary); }
  .field input:focus, .field select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  .field input.invalid, .field select.invalid { border-color: #eb4949; }
  .field-readonly { font-size: 13.5px; color: var(--text-secondary); padding: 2px 0; }
  .btn-submit { width: 100%; height: 44px; border-radius: var(--radius-sm); border: 0; background: var(--primary);
    color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 6px; }
  .btn-submit:hover { background: var(--primary-strong); }
  .btn-submit:disabled { background: rgba(105,118,131,.25); cursor: not-allowed; }

  .lrow .t .sub { font-weight: 400; color: var(--text-muted); margin-left: 7px; }

  .hl { background: #fff3a8; border-radius: 3px; }

  /* 태블릿: 상단바 요소를 줄여 넘침 방지 (뷰 전환은 유지) */
  @media (max-width: 900px) {
    .brand .sub { display: none; }
    .tb-user .nm { display: none; }
    .lbl-lg { display: none; }
    .lbl-sm { display: inline; }
    .tb-search { flex: 1 1 140px; min-width: 0; }
    .topbar { gap: 10px; padding: 0 14px; }
  }

  /* 모바일: 리스트 고정 */
  @media (max-width: 767px) {
    .seg { display: none; }
    .brand .sub, .brand b { display: none; }
    .tb-user .nm { display: none; }
    .tb-btn.hide-sm { display: none; }
    .lbl-lg { display: none; }
    .lbl-sm { display: inline; }
    .tb-search { flex: 1 1 auto; min-width: 0; }
    .page { padding: 14px 14px 24px; }
    .topbar { padding: 0 12px; gap: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: .01ms !important; } }
</style>
</head>

<!-- Loading -->

<!-- Login -->

        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>

<!-- Blocked -->
<div id="blockedScreen">

<div id="app">

/* ── Logging ──
   열람(클릭) 기록은 logs 에 남기지 않는다. logs 는 로그인한 사용자라면 누구나 읽을 수 있어서,
   누가 무엇을 언제 봤는지가 팀 전체에 공개되기 때문. 최근 본 항목은 본인만 읽는 userPrefs 에만 저장한다. */
const LOG_TTL_DAYS = 180;
function logEvent(type, data) {
  try {
    const u = auth.currentUser;
    const expiresAt = new Date();
    expiresAt.setDate(expiresAt.getDate() + LOG_TTL_DAYS);
    const payload = {
      type,
      userEmail: (data && data.userEmail) || (u && u.email) || null,
      userName:  (u && u.displayName) || null,
      userId:    (u && u.uid) || null,
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      expiresAt: firebase.firestore.Timestamp.fromDate(expiresAt),
      ...data
    };
    db.collection('logs').add(payload).catch(err => console.warn('[log]', type, err.message));
  } catch(e) { console.warn('[log] error:', e); }
}

const LAYOUT_ID = 'layout-order';   /* __x__ 형태는 Firestore 예약 ID 라 쓸 수 없다 */

function catOrder() {
  const out = [], seen = new Set();
  (layoutCats || []).forEach(c => {
    if (DEFAULT_ORDER.indexOf(c) >= 0 && !seen.has(c)) { seen.add(c); out.push(c); }
  });
  DEFAULT_ORDER.forEach(c => { if (!seen.has(c)) { seen.add(c); out.push(c); } });
  return out;
}
const catColor = id => (CATEGORIES.find(c => c.id === id) || {}).color || '#697683';

  const c = catColor(id);
  return 'background:color-mix(in srgb,' + c + ' 15%,#fff);color:color-mix(in srgb,' + c + ' 78%,#000)';
}

/* ── 개인 설정 저장 ──
   1순위 Firestore userPrefs/{uid} (기기 간 동기화), 폴백 localStorage (이 브라우저 전용).
   보안 규칙에 userPrefs 블록이 없으면 permission-denied 가 나므로 자동으로 폴백한다. */
const PREFS_KEY = 'unni-dash-prefs-v1';
const RECENT_MAX = 5;   /* 최근 본 항목은 최대 5건만 남긴다 */
let prefsRef = null;
let prefsRemoteOK = true;
let prefsLoaded = false;

function readLocalPrefs() {
  try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch(e) { return {}; }
}
function writeLocalPrefs() {
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify({
      view: state.view, fav: [...state.fav], recent: state.recent
    }));
  } catch(e) {}
}
function applyPrefs(p) {
  if (p.view === 'list' || p.view === 'board') state.view = p.view;
  if (p.viewMode === 'list' || p.viewMode === 'board') state.view = p.viewMode;
  if (Array.isArray(p.fav)) state.fav = new Set(p.fav);
  if (Array.isArray(p.favorites)) state.fav = new Set(p.favorites);
  if (Array.isArray(p.recent)) state.recent = p.recent.filter(r => r && r.id).slice(0, RECENT_MAX);
}
function showPrefsNotice() {
  try { if (sessionStorage.getItem('prefsNoticeDismissed')) return; } catch(e) {}
  const el = document.getElementById('prefsNotice');
  if (el) el.classList.add('visible');
}
async function loadPrefs(uid) {
  applyPrefs(readLocalPrefs());   // 즉시 반영 — 첫 화면 깜빡임 방지
  prefsLoaded = true;
  try {
    prefsRef = db.collection('userPrefs').doc(uid);
    const snap = await prefsRef.get();
    if (snap.exists) { applyPrefs(snap.data() || {}); writeLocalPrefs(); render(); }
    else if (state.fav.size || state.recent.length) { savePrefs(); }
  } catch (e) {
    prefsRemoteOK = false;
    console.warn('[prefs] Firestore 저장 불가 — 이 브라우저에만 저장합니다.', e && e.code);
    showPrefsNotice();
  }
}
function savePrefs() {
  writeLocalPrefs();
  if (!prefsRemoteOK || !prefsRef) return;
  prefsRef.set({
    favorites: [...state.fav],
    recent: state.recent,
    viewMode: state.view,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).catch(e => {
    prefsRemoteOK = false;
    console.warn('[prefs] 저장 실패 — 이 브라우저에만 저장합니다.', e && e.code);
    showPrefsNotice();
  });
}

/* ── Auth ── */
auth.onAuthStateChanged((user) => {
  hideLoading(); hideLogin(); hideBlocked();
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  if (!user) {
    dashboards = []; prefsRef = null; prefsLoaded = false;
    reorderMode = false; draft = null;
    document.getElementById('btnReorder').style.display = 'none';
    showLogin(); return;
  }
  const domain = user.email.split('@')[1];
  if (domain !== ALLOWED_DOMAIN) {
    const blockedEmail = user.email;
    logEvent('blocked', { userEmail: blockedEmail, attemptedDomain: domain });
    auth.signOut();
    showBlocked(blockedEmail);
    return;
  }
  if (pendingExplicitLogin) { pendingExplicitLogin = false; logEvent('login', {}); }
  showApp(user);
  document.getElementById('btnReorder').style.display = isAdmin() ? '' : 'none';
  loadPrefs(user.uid);
  subscribeToDashboards();
});

document.getElementById('loginBtn').onclick = () => {
  clearLoginError();
  showLoading();
  pendingExplicitLogin = true;
  auth.signInWithPopup(provider).catch(err => {
    console.warn('[Auth popup]', err.code, err.message);
    if (err.code === 'auth/popup-blocked') {
      auth.signInWithRedirect(provider).catch(() => {
        pendingExplicitLogin = false; hideLoading();
        showLoginError('로그인 중 오류가 발생했어요. 잠시 후 다시 시도해주세요.');
      });
      return;
    }
    if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
      pendingExplicitLogin = false; hideLoading(); return;
    }
    if (err.code === 'auth/unauthorized-domain') {
      pendingExplicitLogin = false; hideLoading();
      showLoginError('이 도메인은 Firebase에 미등록 상태예요.\n배포 주소(hp-dashdoard.vercel.app)에서 접속해주세요.');
      return;
    }
    pendingExplicitLogin = false; hideLoading();
    showLoginError('로그인 중 오류가 발생했어요. (' + err.code + ')');
  });
};
auth.getRedirectResult().then(result => {
  if (result && result.user) pendingExplicitLogin = true;
}).catch(err => {
  if (err.code && err.code !== 'auth/no-such-operation') console.warn('[Auth redirect result]', err.code);
});
document.getElementById('blockedLogoutBtn').onclick = () => { hideBlocked(); showLogin(); };
document.getElementById('btnSignout').onclick = () => auth.signOut();

/* ── Firestore ── */
function subscribeToDashboards() {
  unsubscribe = db.collection('dashboards').orderBy('createdAt', 'desc').onSnapshot(
    snap => {
      const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const lay = all.find(d => d.id === LAYOUT_ID || d._type === 'layout');
      layoutExists = !!lay;
      layoutCats = lay && Array.isArray(lay.categories) ? lay.categories : null;
      dashboards = all.filter(d => d.id !== LAYOUT_ID && d._type !== 'layout');
      if (reorderMode) draft = buildDraft();   /* 다른 사람이 추가/삭제했을 때 반영 */
      render();
    },
    err  => {
      document.getElementById('content').innerHTML =
        '<div class="empty">데이터를 불러오지 못했어요.<br><small>' + esc(err.message) + '</small></div>';
    }
  );
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function highlight(text, q) {
  const t = esc(text);
  if (!q) return t;
  const e = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try { return t.replace(new RegExp(e, 'gi'), m => '<span class="hl">' + m + '</span>'); }
  catch(err) { return t; }
}

function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return '방금'; if (m < 60) return m + '분 전';
  const h = Math.round(m / 60); if (h < 24) return h + '시간 전';
  const d = Math.round(h / 24); return d === 1 ? '어제' : d + '일 전';
}
const isArchived = d => (d.category || '') === ARCHIVE_CATEGORY;
function matches(d, q) {
  if (!q) return true;
  return ((d.title||'') + ' ' + (d.desc||'') + ' ' + (d.author||'') + ' ' + (d.date||'')).toLowerCase().includes(q);
}
function safeUrl(u) {
  const s = String(u || '').trim();
  return /^https?:\/\//i.test(s) ? s : 'https://' + s.replace(/^\/+/, '');
}

/* 등록 순서용 시각 — createdAt(서버 타임스탬프)이 없으면 등록일 문자열로 대체 */
function createdMs(d) {
  const t = d && d.createdAt;
  if (t && typeof t.toMillis === 'function') return t.toMillis();
  if (t && typeof t.seconds === 'number') return t.seconds * 1000;
  const p = Date.parse(String((d && d.date) || '').replace(/\./g, '-').replace(/-+$/, ''));
  return isNaN(p) ? 0 : p;
}
/* 카테고리 안 카드 순서 — order 가 지정된 카드가 먼저(지정 순), 나머지는 등록 순.
   새로 추가한 카드는 order 가 없으므로 자연스럽게 맨 아래로 간다. */
function cardSort(a, b) {
  const ao = typeof a.order === 'number', bo = typeof b.order === 'number';
  if (ao && bo) return a.order - b.order;
  if (ao !== bo) return ao ? -1 : 1;
  return createdMs(a) - createdMs(b);
}

function buildDraft() {

  return catOrder().map(c => ({

    ids: active.filter(d => (d.category || '기타') === c).sort(cardSort).map(d => d.id),

              .filter(g => g.items.length);

/* 커서 좌표로 "어느 요소의 앞/뒤에 넣을지" 판정.
   보드는 칸이 가로로도 늘어서므로 세로 위치만으로는 안 되고 2차원으로 본다. */
function dropSpot(container, sel, x, y, dragEl) {
  const els = [...container.children].filter(el => el.matches(sel) && el !== dragEl);
  let hit = null;
  for (const el of els) {
    const b = el.getBoundingClientRect();
    if (x >= b.left && x <= b.right && y >= b.top && y <= b.bottom) { hit = { el, b }; break; }
  }
  if (!hit) {
    let bestD = Infinity;
    els.forEach(el => {
      const b = el.getBoundingClientRect();
      const dx = Math.max(b.left - x, 0, x - b.right);
      const dy = Math.max(b.top - y, 0, y - b.bottom);
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; hit = { el, b }; }
    });
  }
  if (!hit) return null;
  return { el: hit.el, before: y < hit.b.top + hit.b.height / 2 };
}
function placeInto(container, sel, el, x, y) {
  const spot = dropSpot(container, sel, x, y, el);
  if (!spot) { container.appendChild(el); return; }
  if (spot.before) container.insertBefore(el, spot.el);
  else container.insertBefore(el, spot.el.nextSibling);
}
function readDraft() {
  const root = document.getElementById('content');
  draft = [...root.querySelectorAll('[data-cat]')].map(el => ({
    c: el.dataset.cat,
    ids: [...el.querySelectorAll('[data-item]')].map(x => x.dataset.item),
  }));
  /* 화면에 없는 빈 카테고리는 기존 순서를 잃지 않도록 뒤에 그대로 붙인다 */
  const shown = new Set(draft.map(g => g.c));
  catOrder().forEach(c => { if (!shown.has(c)) draft.push({ c, ids: [] }); });
  draftDirty = true;
  const btn = document.getElementById('roSave');
  if (btn) btn.disabled = false;
}
function moveItem(el, dir) {
  const body = el.parentElement;
  const sibs = [...body.querySelectorAll('[data-item]')];
  const i = sibs.indexOf(el), j = i + dir;
  if (j < 0 || j >= sibs.length) return;
  if (dir < 0) body.insertBefore(el, sibs[j]); else body.insertBefore(sibs[j], el);
  readDraft(); fitBoardColumns(); el.focus();
}
function wireReorder() {
  const root = document.getElementById('content');
  const catBox = root.querySelector('.board') || root.querySelector('.list');
  const catSel = root.querySelector('.board') ? '.col' : '.lgrpbox';
  let dragEl = null, dragKind = null, homeBody = null;

  root.addEventListener('dragstart', e => {
    const head = e.target.closest('.colh, .lgrp');
    const item = e.target.closest('[data-item]');
    if (item) { dragEl = item; dragKind = 'item'; homeBody = item.parentElement; }
    else if (head) { dragEl = head.closest('[data-cat]'); dragKind = 'cat'; }
    else return;
    dragEl.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', ''); } catch(err) {}
  });
  root.addEventListener('dragend', () => {
    if (!dragEl) return;
    dragEl.classList.remove('dragging');
    dragEl = null; dragKind = null; homeBody = null;
    readDraft(); fitBoardColumns();
  });
  root.addEventListener('dragover', e => {
    if (!dragEl) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (dragKind === 'item') {
      const body = e.target.closest('[data-body]');
      if (!body || body !== homeBody) return;    /* 카테고리 사이 이동은 막는다 */
      placeInto(body, '[data-item]', dragEl, e.clientX, e.clientY);
    } else if (catBox) {
      placeInto(catBox, catSel, dragEl, e.clientX, e.clientY);
    }
  });
  root.addEventListener('drop', e => e.preventDefault());
  /* 드래그가 어려운 환경을 위한 키보드 대체 (카드를 누른 뒤 ↑ ↓) */
  root.addEventListener('keydown', e => {
    const item = e.target.closest('[data-item]');
    if (!item || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    moveItem(item, e.key === 'ArrowUp' ? -1 : 1);
  });
  document.getElementById('roCancel').onclick = exitReorder;
  document.getElementById('roSave').onclick = saveOrder;
}
function enterReorder() {
  if (!isAdmin()) return;
  if (deleteMode) exitDeleteMode();
  reorderMode = true; draftDirty = false;
  draft = buildDraft();
  document.body.classList.add('reorder-mode');
  reorderBtn.classList.add('active');
  reorderBtn.textContent = '편집 종료';
  render();
}
function exitReorder() {
  reorderMode = false; draft = null; draftDirty = false;
  document.body.classList.remove('reorder-mode');
  reorderBtn.classList.remove('active');
  reorderBtn.textContent = '순서 편집';
  render();
}
async function saveOrder() {
  if (!isAdmin() || !draft) return;
  const btn = document.getElementById('roSave');
  btn.disabled = true; btn.textContent = '저장 중…';
  try {
    const byId = {};
    dashboards.forEach(d => { byId[d.id] = d; });
    const batch = db.batch();
    let changed = 0;
    draft.forEach(g => g.ids.forEach((id, i) => {
      const d = byId[id];
      if (d && d.order !== i) { batch.update(db.collection('dashboards').doc(id), { order: i }); changed++; }
    }));
    const lay = {
      _type: 'layout',
      categories: draft.map(g => g.c),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: auth.currentUser ? auth.currentUser.uid : null,
    };
    /* createdAt 이 있어야 목록 구독(orderBy createdAt)에 잡힌다 */
    if (!layoutExists) lay.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    batch.set(db.collection('dashboards').doc(LAYOUT_ID), lay, { merge: true });
    await batch.commit();
    logEvent('reorder', { changedCards: changed, categories: lay.categories });
    exitReorder();
  } catch(e) {
    btn.disabled = false; btn.textContent = '저장';
    alert('순서를 저장하지 못했어요: ' + e.message);
  }
}

/* ── 전체 렌더 ── */
function render() {
  if (reorderMode) {
    if (!draft) draft = buildDraft();
    document.querySelectorAll('#viewSeg button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.view === effectiveView()));
    });
    document.getElementById('content').innerHTML = reorderHTML();
    wireReorder();
    fitBoardColumns();
    if (draftDirty) document.getElementById('roSave').disabled = false;
    return;
  }
  const q = state.q.trim().toLowerCase();
  const active = dashboards.filter(d => !isArchived(d) && matches(d, q));
  const gs = groupsOf(active);
  const v = effectiveView();

  document.querySelectorAll('#viewSeg button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.view === v));
  });

  let html = '';
  if (!deleteMode) html += railHTML() + recentHTML();
  html += '<div class="sec-h" style="margin-top:' + (deleteMode ? '0' : '24px') + '">전체'
        + '<span class="n">' + active.length + (q ? '건 검색됨' : '건') + '</span><i class="rule"></i></div>';
  html += active.length
    ? (v === 'board' ? boardHTML(gs, q) : listHTML(gs, q))
    : '<div class="empty">' + (q ? '검색 결과가 없어요.' : '아직 등록된 대시보드가 없어요.<br>상단 "대시보드 추가"를 눌러보세요.') + '</div>';
  html += archiveHTML(q);

  document.getElementById('content').innerHTML = html;
  wireContent();
  fitBoardColumns();
}


/* 보드 열 맞춤 — 최대 5열이지만, 가장 큰 칸이 높이를 정하기 때문에
   넓은 화면에서 열 하나가 비는 경우가 생긴다. 실제로 쓰이는 열 수를 재서
   그만큼으로 줄여 남는 가로 공간 없이 꽉 채운다. */
function fitBoardColumns() {
  const bd = document.querySelector('.board');
  if (!bd) return;
  bd.style.columnCount = '';
  for (let i = 0; i < 3; i++) {
    const lefts = new Set([...bd.querySelectorAll('.col')].map(c => Math.round(c.getBoundingClientRect().left)));
    const used = lefts.size;
    if (!used || String(used) === bd.style.columnCount) break;
    bd.style.columnCount = String(used);
  }
}
let fitTimer = null;
window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitBoardColumns, 120); });

function wireContent() {
  const root = document.getElementById('content');
  root.querySelectorAll('[data-fav]').forEach(b => b.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    const id = b.dataset.fav;
    if (state.fav.has(id)) state.fav.delete(id); else state.fav.add(id);
    savePrefs(); render();
  }));
  root.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    const d = dashboards.find(x => x.id === b.dataset.edit);
    if (d) openModal('edit', d);
  }));
  root.querySelectorAll('[data-open]').forEach(a => a.addEventListener('click', () => {
    const id = a.dataset.open;
    state.recent = [{ id, at: Date.now() }].concat(state.recent.filter(r => r.id !== id)).slice(0, RECENT_MAX);
    savePrefs();
    setTimeout(render, 0);   // 새 탭이 열린 뒤 목록 갱신
  }));
  root.querySelectorAll('[data-select]').forEach(el => el.addEventListener('click', () => toggleSelect(el.dataset.select)));
  const ab = document.getElementById('archBar');
  if (ab) ab.addEventListener('click', () => { state.archOpen = !state.archOpen; render(); });
}

/* ── 상단바 ── */
document.getElementById('searchInput').addEventListener('input', e => { state.q = e.target.value; render(); });
document.querySelectorAll('#viewSeg button').forEach(b => b.addEventListener('click', () => {
  state.view = b.dataset.view; savePrefs(); render();   /* 편집 중에도 draft 는 유지된다 */
}));
mobileMQ.addEventListener('change', render);
document.getElementById('btnAdd').onclick = () => { if (deleteMode) exitDeleteMode(); if (reorderMode) exitReorder(); openModal('add'); };
document.getElementById('btnManage').onclick = () => { if (reorderMode) exitReorder(); deleteMode ? exitDeleteMode() : enterDeleteMode(); };
const reorderBtn = document.getElementById('btnReorder');
reorderBtn.onclick = () => { reorderMode ? exitReorder() : enterReorder(); };
document.getElementById('noticeClose').onclick = () => {
  document.getElementById('prefsNotice').classList.remove('visible');
  try { sessionStorage.setItem('prefsNoticeDismissed', '1'); } catch(e) {}
};

/* ── 삭제 모드 ── */
const deleteBar = document.getElementById('deleteBar');
const deleteBanner = document.getElementById('deleteBanner');
const manageBtn = document.getElementById('btnManage');
function enterDeleteMode() {
  if (!dashboards.length) return;
  deleteMode = true; selectedIds.clear();
  document.body.classList.add('delete-mode');
  deleteBar.classList.add('open'); deleteBanner.classList.add('open'); manageBtn.classList.add('active');
  manageBtn.textContent = '관리 종료';
  updateDeleteCount(); render();
}
function exitDeleteMode() {
  deleteMode = false; selectedIds.clear();
  document.body.classList.remove('delete-mode');
  deleteBar.classList.remove('open'); deleteBanner.classList.remove('open'); manageBtn.classList.remove('active');
  manageBtn.textContent = '관리';
  render();
}
function toggleSelect(id) {
  if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  updateDeleteCount(); render();
}
function updateDeleteCount() {
  const btn = document.getElementById('dbDelete');
  const n = selectedIds.size;
  btn.textContent = n > 0 ? `삭제 (${n})` : '삭제';
  btn.disabled = n === 0;
}
document.getElementById('dbCancel').onclick = exitDeleteMode;
document.getElementById('dbDelete').onclick = async () => {
  const n = selectedIds.size;
  if (n === 0) return;
  if (!confirm(`선택한 ${n}개의 대시보드를 삭제하시겠습니까?\n이 작업은 되돌릴 수 없어요.`)) return;
  const deletedItems = dashboards.filter(d => selectedIds.has(d.id)).map(d => ({ id: d.id, title: d.title, author: d.author, url: d.url }));
  try {
    const batch = db.batch();
    selectedIds.forEach(id => batch.delete(db.collection('dashboards').doc(id)));
    await batch.commit();
    logEvent('delete', { count: n, deletedItems });
    deletedItems.forEach(it => state.fav.delete(it.id));
    state.recent = state.recent.filter(r => !deletedItems.some(it => it.id === r.id));
    savePrefs();
    exitDeleteMode();
  } catch(e) { alert('삭제 중 오류가 발생했어요: ' + e.message); }
};

/* ── Modal ── */
const overlay = document.getElementById('overlay');
function openModal(mode, dashboard) {
  modalMode = mode;
  editingId = dashboard ? dashboard.id : null;
  if (mode === 'edit' && dashboard) {
    document.getElementById('modalTitle').textContent = '대시보드 수정하기';
    document.getElementById('f-title').value = dashboard.title || '';
    document.getElementById('f-desc').value = (dashboard.desc || '').slice(0, DESC_MAX);
    document.getElementById('f-url').value = dashboard.url || '';
    document.getElementById('f-category').value = dashboard.category || '';
    document.getElementById('f-author').value = dashboard.author || '';
    document.getElementById('f-date').textContent = dashboard.date || '';
    document.getElementById('submitBtn').textContent = '수정 완료';
  } else {
    document.getElementById('modalTitle').textContent = '대시보드 추가하기';
    document.getElementById('f-title').value = '';
    document.getElementById('f-desc').value = '';
    document.getElementById('f-url').value = '';
    document.getElementById('f-category').value = '';
    const u = auth.currentUser;
    let author = '';
    if (u && u.email) {
      const nick = u.email.split('@')[0].split('.')[0];
      if (nick) author = nick.charAt(0).toUpperCase() + nick.slice(1).toLowerCase();
    }
    document.getElementById('f-author').value = author;
    document.getElementById('f-date').textContent = todayStr;
    document.getElementById('submitBtn').textContent = '추가하기';
  }
  clearAllErrors();
  refreshDesc(false);
  overlay.style.display = 'flex';
  requestAnimationFrame(() => { overlay.offsetHeight; overlay.classList.add('open'); });
  setTimeout(() => document.getElementById('f-title').focus(), 180);
}
function closeModal() {
  overlay.classList.remove('open');
  setTimeout(() => { overlay.style.display = 'none'; }, 210);
}
document.getElementById('modalClose').onclick = closeModal;
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (overlay.style.display === 'flex') closeModal();
  else if (reorderMode) exitReorder();
  else if (deleteMode) exitDeleteMode();
});

/* 설명은 보드 카드에서 항상 한 줄이다(nowrap + 말줄임).
   가장 좁은 칸(약 291px)에 온전히 들어가는 한글은 21자쯤이라, 25자를 꽉 채우면
   좁은 칸에서는 끝이 말줄임으로 잘릴 수 있다. 두 줄이 되지는 않는다. */
const DESC_MAX = 25;
const descInput = document.getElementById('f-desc');
const descHint  = document.getElementById('descHint');
const descCount = document.getElementById('descCount');
document.getElementById('descMax').textContent = DESC_MAX;
descInput.setAttribute('maxlength', String(DESC_MAX));
let descComposing = false;
function descLimitMsg(show) {
  setFieldError('f-desc', 'err-desc', show ? '설명은 ' + DESC_MAX + '자까지 쓸 수 있어요' : '');
}
function refreshDesc(hitLimit) {
  if (!descComposing && descInput.value.length > DESC_MAX) {
    descInput.value = descInput.value.slice(0, DESC_MAX);   /* IME·붙여넣기 보정 */
    hitLimit = true;
  }
  const n = descInput.value.length;
  descCount.textContent = n;
  descHint.classList.toggle('full', n >= DESC_MAX);
  if (hitLimit) descLimitMsg(true);
  else if (n < DESC_MAX) descLimitMsg(false);
}
descInput.addEventListener('compositionstart', () => { descComposing = true; });
descInput.addEventListener('compositionend', () => { descComposing = false; refreshDesc(false); });
descInput.addEventListener('beforeinput', e => {
  if (!e.inputType || e.inputType.indexOf('insert') !== 0) return;   /* 지우기는 통과 */
  const sel = descInput.selectionEnd - descInput.selectionStart;
  const add = (e.data || (e.dataTransfer && e.dataTransfer.getData('text')) || ' ').length;
  if (descInput.value.length - sel + add > DESC_MAX) refreshDesc(true);
});
descInput.addEventListener('input', () => refreshDesc(false));

function setFieldError(inputId, errId, msg) {
  const inp = document.getElementById(inputId);
  const err = document.getElementById(errId);
  if (inp) inp.classList.toggle('invalid', !!msg);
  if (err) err.textContent = msg;
}
function clearAllErrors() {
  [['f-title','err-title'],['f-desc','err-desc'],['f-url','err-url'],['f-category','err-category']].forEach(([i,e]) => setFieldError(i, e, ''));
}
['f-title','f-url'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => setFieldError(id, 'err-' + id.slice(2).toLowerCase(), ''));
});
document.getElementById('f-category').addEventListener('change', () => setFieldError('f-category','err-category',''));

document.getElementById('submitBtn').onclick = async () => {
  const title    = document.getElementById('f-title').value.trim();
  const desc     = document.getElementById('f-desc').value.trim().slice(0, DESC_MAX);
  const url      = document.getElementById('f-url').value.trim();
  const author   = document.getElementById('f-author').value.trim();
  const category = document.getElementById('f-category').value;

  clearAllErrors();
  let valid = true;
  if (!title)    { setFieldError('f-title',    'err-title',    '필수 입력입니다'); valid = false; }
  if (!url)      { setFieldError('f-url',      'err-url',      '필수 입력입니다'); valid = false; }
  if (!category) { setFieldError('f-category', 'err-category', '필수 선택입니다'); valid = false; }
  if (!valid) { if (!title) document.getElementById('f-title').focus(); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  try {
    if (modalMode === 'edit' && editingId) {
      await db.collection('dashboards').doc(editingId).update({
        title, desc, url, author, category,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy: auth.currentUser ? auth.currentUser.uid : null,
      });
      logEvent('edit', { dashboardId: editingId, dashboardTitle: title, dashboardUrl: url, dashboardCategory: category });
    } else {
      await db.collection('dashboards').add({
        title, desc, url, author, category,
        date: todayStr,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        createdBy: auth.currentUser ? auth.currentUser.uid : null,
      });
      logEvent('add', { dashboardTitle: title, dashboardUrl: url, dashboardAuthor: author, dashboardCategory: category });
    }
    closeModal();
  } catch(e) {
    alert((modalMode === 'edit' ? '수정' : '추가') + ' 중 오류가 발생했어요: ' + e.message);
  } finally {
    btn.disabled = false;
  }
};
</script>
